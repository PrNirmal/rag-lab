services:

  backend:
    build:
      context: ./backend
    container_name: rag-qa-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/data:/app/data
    networks:
      - rag-network

  frontend:
    build:
      context: ./frontend/rag-qa
    container_name: rag-qa-ui
    ports:
      - "3000:80"
    environment:
      - BACKEND_URL=http://rag-qa-api:8000
    networks:
      - rag-network
    depends_on:
      - backend

networks:
  rag-network:
    driver: bridge