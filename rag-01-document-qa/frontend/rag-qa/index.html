<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>RAG QA</title>
  </head>
  <body>
    <div id="root">
      <!-- Default Initial Startup Loader -->
      <div id="initial-loader" style="
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        z-index: 99999;
      ">
        <style>
          @keyframes initPulse {
            0% { transform: scale(0.96); box-shadow: 0 10px 25px -5px rgba(99,102,241,0.25), 0 0 0 0 rgba(99,102,241,0.2); }
            50% { transform: scale(1.04); box-shadow: 0 20px 35px -5px rgba(99,102,241,0.35), 0 0 0 10px rgba(99,102,241,0.06); }
            100% { transform: scale(0.96); box-shadow: 0 10px 25px -5px rgba(99,102,241,0.25), 0 0 0 0 rgba(99,102,241,0.2); }
          }
          @keyframes initSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        </style>
        <div style="
          width: 80px;
          height: 80px;
          border-radius: 22px;
          background: #ffffff;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 15px 30px -5px rgba(99,102,241,0.25);
          border: 1px solid rgba(99,102,241,0.15);
          margin-bottom: 20px;
          animation: initPulse 2s ease-in-out infinite;
        ">
          <img src="/src/assets/logo.png" alt="RAG QA" style="width: 42px; height: 42px; object-fit: contain;" />
        </div>
        <div style="font-size: 22px; font-weight: 700; color: #030712; letter-spacing: -0.02em; margin-bottom: 6px;">
          RAG Studio
        </div>
        <div style="font-size: 13px; color: #6b7280; margin-bottom: 22px;">
          Intelligent Retrieval System
        </div>
        <div style="
          width: 24px;
          height: 24px;
          border: 2.5px solid rgba(99, 102, 241, 0.15);
          border-top-color: #6366f1;
          border-radius: 50%;
          animation: initSpin 0.8s linear infinite;
        "></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
