server {
    listen 80;
    server_name localhost;

    # Allow uploads up to 25MB (matching UI max limit)
    client_max_body_size 25M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend container or remote Render URL
    location /api/ {
        proxy_pass ${BACKEND_URL}/api/;
        
        # Required for SSL handshakes when proxying to HTTPS upstreams (Render / Cloudflare)
        proxy_ssl_server_name on;
        
        # Ensure Host header matches upstream domain for Render cloud routing
        proxy_set_header Host $proxy_host;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous timeouts for document indexing and LLM query generation
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}